<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trading Desk Trainer</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trainer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E4ECE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C362F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&amp;display=swap">
<style>
/* Trading Desk Trainer. Light is ledger paper, dark is an exchange chalkboard. */
*{box-sizing:border-box;min-width:0}
:root{
  color-scheme:light dark;
  --paper:#E4ECE4; --sheet:#F2F6F0; --sheet2:#EAF0E8; --ink:#14302A; --ink2:#4A6159; --rule:#A9C0B2; --rule2:#CBD9CF;
  --bid:#1B5C9E; --ask:#A8322A; --mark:#7E5A00; --good:#256B41; --bad:#A8322A; --margin:#C9706A; --chip:#DCE6DD; --shadow:rgba(20,48,42,.10);
}
@supports (color: light-dark(#000, #fff)){
  :root{
    --paper:light-dark(#E4ECE4,#1C362F); --sheet:light-dark(#F2F6F0,#22413A); --sheet2:light-dark(#EAF0E8,#274A41); --ink:light-dark(#14302A,#ECF2EC); --ink2:light-dark(#4A6159,#A9BFB5);
    --rule:light-dark(#A9C0B2,#45695D); --rule2:light-dark(#CBD9CF,#33554B); --bid:light-dark(#1B5C9E,#93C6F2); --ask:light-dark(#A8322A,#F3A497);
    --mark:light-dark(#7E5A00,#EFD57A); --good:light-dark(#256B41,#9DDAAB); --bad:light-dark(#A8322A,#F3A497); --margin:light-dark(#C9706A,#B9705F); --chip:light-dark(#DCE6DD,#2C5047); --shadow:light-dark(rgba(20,48,42,.10),rgba(0,0,0,.25));
  }
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){--paper:#1C362F;--sheet:#22413A;--sheet2:#274A41;--ink:#ECF2EC;--ink2:#A9BFB5;--rule:#45695D;--rule2:#33554B;--bid:#93C6F2;--ask:#F3A497;--mark:#EFD57A;--good:#9DDAAB;--bad:#F3A497;--margin:#B9705F;--chip:#2C5047;--shadow:rgba(0,0,0,.25)}
}
:root[data-theme=light]{color-scheme:light;--paper:#E4ECE4;--sheet:#F2F6F0;--sheet2:#EAF0E8;--ink:#14302A;--ink2:#4A6159;--rule:#A9C0B2;--rule2:#CBD9CF;--bid:#1B5C9E;--ask:#A8322A;--mark:#7E5A00;--good:#256B41;--bad:#A8322A;--margin:#C9706A;--chip:#DCE6DD;--shadow:rgba(20,48,42,.10)}
:root[data-theme=dark]{color-scheme:dark;--paper:#1C362F;--sheet:#22413A;--sheet2:#274A41;--ink:#ECF2EC;--ink2:#A9BFB5;--rule:#45695D;--rule2:#33554B;--bid:#93C6F2;--ask:#F3A497;--mark:#EFD57A;--good:#9DDAAB;--bad:#F3A497;--margin:#B9705F;--chip:#2C5047;--shadow:rgba(0,0,0,.25)}

html{-webkit-text-size-adjust:100%}
:root{--body:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;--display:'Archivo','Arial Narrow','Roboto Condensed','Helvetica Neue',system-ui,sans-serif}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;font-variant-numeric:lining-nums;overflow-x:hidden}
.boardtop,.tick b,.ticket,.options button,.scorebig,.market-line,.quote input,table.ledger td.num,.rhead b,.pos b,.keypad button{font-variant-numeric:tabular-nums lining-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--bid);outline-offset:2px}
kbd{font:inherit;font-size:.78em;font-weight:600;padding:0 .4em;border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;background:var(--sheet);white-space:nowrap}
a{color:var(--bid)}
sup{font-size:.62em;line-height:0}

.app{max-width:1240px;margin:0 auto;padding:0 14px 40px}
/* ---- header tape ---- */
.tape{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 18px;padding:14px 2px 10px;border-bottom:3px double var(--rule)}
.brand{font-stretch:72%;font-weight:800;font-size:clamp(24px,4.2vw,34px);letter-spacing:-.01em;line-height:1;margin:0}
.brand span{display:inline-block;width:.42em;height:.42em;border-radius:50%;background:var(--good);margin-right:.32em;vertical-align:.12em}
.ticks{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--ink2)}
.tick b{color:var(--ink);font-weight:700;font-stretch:85%;font-size:17px;margin-left:4px}
.tick .up{color:var(--good)} .tick .down{color:var(--bad)}

/* ---- shell ---- */
.shell{display:grid;grid-template-columns:178px 1fr;gap:22px;margin-top:16px}
.rail{display:flex;flex-direction:column;gap:2px;position:sticky;top:10px;align-self:start}
.rail button{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;border:0;background:none;padding:10px 12px;min-height:44px;border-radius:6px;font-weight:600;font-stretch:88%;font-size:16px;color:var(--ink2)}
.rail button:hover{background:var(--sheet2);color:var(--ink)}
.rail button[aria-current=page]{background:var(--sheet);color:var(--ink);box-shadow:inset 4px 0 0 var(--ink)}
.rail .badge{font-size:12px;font-weight:700;background:var(--ask);color:var(--sheet);border-radius:10px;padding:0 7px;line-height:18px}
main{min-height:60vh}
@media (max-width:880px){
  .shell{grid-template-columns:1fr;gap:12px}
  .rail{flex-direction:row;overflow-x:auto;position:static;gap:4px;padding-bottom:4px;scrollbar-width:thin}
  .rail button{flex:0 0 auto;padding:8px 12px}
  .rail button[aria-current=page]{box-shadow:inset 0 -3px 0 var(--ink)}
}

/* ---- typographic scale ---- */
h1,h2,h3,.brand,.prompt,.scorebig,.market-line,.ticket,.keypad button,.options button,.slot,.quote input,.plan li::before,.path button::before,.tick b,.boardtop .clock{font-family:var(--display)}
h1,h2,h3{font-stretch:78%;font-weight:800;line-height:1.08;margin:0}
h1{font-size:clamp(26px,4vw,36px)}
h2{font-size:clamp(21px,3vw,26px)}
h3{font-size:18px;font-stretch:88%;font-weight:700}
p{margin:.4em 0;max-width:68ch}
.muted{color:var(--ink2)}
.small{font-size:14px}
.lead{font-size:17px;max-width:62ch}

/* ---- panels: the ledger sheet ---- */
.sheet{background:var(--sheet);border:1px solid var(--rule2);border-radius:10px;padding:18px;box-shadow:0 1px 0 var(--shadow)}
.sheet + .sheet,.stack > * + *{margin-top:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;align-items:start}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:8px;border:1.5px solid var(--ink);background:var(--ink);color:var(--sheet);font-weight:700;font-stretch:90%}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.big{min-height:52px;font-size:18px;padding:10px 22px}
.btn.bid{background:var(--bid);border-color:var(--bid)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:6px 12px;border-radius:20px;border:1.5px solid var(--rule);background:transparent;font-weight:600;font-stretch:90%;font-size:15px}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.seg{display:inline-flex;border:1.5px solid var(--rule);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;min-height:42px;padding:6px 14px;font-weight:600;font-stretch:90%}
.seg button + button{border-left:1.5px solid var(--rule)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--sheet)}
label.check{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:4px 10px;border:1.5px solid var(--rule);border-radius:8px;font-weight:600;font-stretch:90%;font-size:15px}
label.check input{width:18px;height:18px;accent-color:var(--ink)}
select.sel{min-height:44px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:6px 10px;font-weight:600;max-width:100%}

/* ---- the board: where every problem lives ---- */
.board{position:relative;background:var(--sheet);border:1px solid var(--rule2);border-radius:12px;padding:16px 18px 18px 30px;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,var(--rule2) 35px,var(--rule2) 36px);background-position:0 18px;overflow:hidden}
.board::before{content:'';position:absolute;top:0;bottom:0;left:16px;width:3px;border-left:1px solid var(--margin);border-right:1px solid var(--margin);opacity:.75}
.boardtop{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 14px;font-size:14px;color:var(--ink2);font-weight:600;font-stretch:90%}
.boardtop .clock{color:var(--ink);font-stretch:80%;font-weight:700;font-size:16px}
.boardtop .clock.over{color:var(--mark)}
.prompt{font-stretch:68%;font-weight:800;font-size:clamp(38px,10vw,92px);line-height:1.04;letter-spacing:-.01em;margin:18px 0 6px;overflow-wrap:anywhere}
.prompt .sub{font-size:.34em;font-stretch:90%;font-weight:600;color:var(--ink2);letter-spacing:0;vertical-align:middle}
.prompt.text{font-size:clamp(20px,2.6vw,25px);font-stretch:92%;font-weight:600;line-height:1.35;letter-spacing:0;max-width:60ch}
.prompt.text .ex{font-weight:800;font-stretch:72%;font-size:1.25em}
.how{font-size:14px;color:var(--ink2);margin-bottom:10px}
.answerline{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.ticket{flex:1 1 220px;max-width:420px;min-height:56px;font-size:30px;font-weight:700;font-stretch:80%;padding:4px 14px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);letter-spacing:.01em}
.ticket.ok{border-color:var(--good);color:var(--good)}
.ticket.no{border-color:var(--bad);color:var(--bad)}
.feedback{min-height:28px;margin-top:10px;font-weight:600;font-size:17px}
.feedback .ok{color:var(--good)} .feedback .no{color:var(--bad)} .feedback .warn{color:var(--mark)}
.steps{margin:10px 0 0;padding:12px 14px 12px 38px;border-left:3px solid var(--ink);background:var(--sheet2);border-radius:0 8px 8px 0;max-width:72ch}
.steps li{margin:4px 0}
.steps li::marker{font-weight:700;font-stretch:80%;color:var(--ink2)}
.trickline{margin-top:10px;padding:10px 14px;border:1.5px dashed var(--rule);border-radius:8px;max-width:72ch}
.trickline b{font-stretch:85%}
.kbdhint{font-size:13px;color:var(--ink2);margin-top:10px}

/* ---- keypad ---- */
.keypad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:420px;margin-top:14px}
.keypad button{min-height:54px;border-radius:9px;border:1.5px solid var(--rule);background:var(--paper);font-size:24px;font-weight:700;font-stretch:80%}
.keypad button:active{background:var(--chip)}
.keypad .enter{grid-column:span 2;background:var(--ink);color:var(--sheet);border-color:var(--ink);font-size:20px}
.keypad .fn{font-size:18px;color:var(--ink2)}
.padtoggle{margin-top:10px}

/* ---- plan ---- */
.plan{list-style:none;margin:0;padding:0;counter-reset:step}
.plan li{counter-increment:step;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--rule2)}
.plan li::before{content:counter(step);font-weight:800;font-stretch:70%;font-size:24px;color:var(--ink2);text-align:center}
.plan li.done::before{content:'\2713';color:var(--good)}
.plan li.next{background:var(--sheet2);border-radius:8px}
.plan .t{font-weight:700;font-stretch:90%}
.plan .m{font-size:14px;color:var(--ink2)}
.upnext{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
@media (max-width:560px){.upnext{grid-template-columns:1fr}}

/* ---- tables ---- */
.tablewrap{overflow-x:auto;max-width:100%}
table.ledger{border-collapse:collapse;width:100%;font-size:15px}
table.ledger.wide{min-width:600px}
.tablewrap{-webkit-overflow-scrolling:touch}
.ledger th,.ledger td{padding:8px 8px;border-bottom:1px solid var(--rule2);text-align:left;vertical-align:top}
.ledger th{font-stretch:85%;font-weight:700;color:var(--ink2);font-size:13px;border-bottom:2px solid var(--rule)}
.ledger td.num,.ledger th.num{text-align:right;white-space:nowrap}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--mark)}
.bar{height:6px;border-radius:3px;background:var(--rule2);overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;background:var(--ink)}

/* ---- 80 in 8 ---- */
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px;max-width:640px}
.options button{min-height:64px;border-radius:10px;border:2px solid var(--rule);background:var(--paper);font-size:clamp(22px,4vw,30px);font-weight:700;font-stretch:78%;display:flex;align-items:center;gap:12px;padding:6px 14px;text-align:left}
.options button .k{font-size:13px;font-weight:700;color:var(--ink2);border:1px solid var(--rule);border-radius:4px;padding:0 6px;font-stretch:100%}
.options button:hover{border-color:var(--ink)}
.options button.hit{border-color:var(--good);color:var(--good)}
.options button.miss{border-color:var(--bad);color:var(--bad)}
.progressline{height:5px;background:var(--rule2);border-radius:3px;overflow:hidden;margin-top:8px}
.progressline > i{display:block;height:100%;background:var(--ink);width:0}
.scorebig{font-stretch:68%;font-weight:800;font-size:clamp(56px,12vw,104px);line-height:1}

/* ---- market ---- */
.quote{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:460px}
.quote label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-stretch:88%;font-size:15px}
.quote .bidl{color:var(--bid)} .quote .askl{color:var(--ask)}
.quote input{min-height:58px;font-size:30px;font-weight:800;font-stretch:76%;padding:4px 12px;border-radius:8px;border:2px solid currentColor;background:var(--paper);width:100%}
.quote input.bidin{color:var(--bid)} .quote input.askin{color:var(--ask)}
.market-line{font-stretch:70%;font-weight:800;font-size:clamp(34px,8vw,64px);line-height:1}
.market-line .b{color:var(--bid)} .market-line .a{color:var(--ask)} .market-line .at{color:var(--ink2);font-size:.55em;margin:0 .25em}
.reveals{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.slot{width:54px;height:54px;border-radius:9px;border:2px dashed var(--rule);display:grid;place-items:center;font-weight:800;font-stretch:75%;font-size:22px;color:var(--ink2)}
.slot.shown{border:2px solid var(--ink);color:var(--ink);background:var(--paper)}
.slot.card{width:44px;height:62px;border-radius:6px;font-size:18px}
.slot.card.red{color:var(--ask)}
.slot.coin{border-radius:50%;width:40px;height:40px;font-size:18px}
.slot svg{width:40px;height:40px}
.pos{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:15px}
.pos b{font-stretch:80%;font-size:20px;margin-left:4px}
.review{list-style:none;margin:12px 0 0;padding:0}
.review li{padding:10px 0;border-bottom:1px solid var(--rule2)}
.rhead{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;margin-bottom:4px;font-size:15px}
.rhead b{font-stretch:85%}
.tradelog{list-style:none;margin:10px 0 0;padding:0;font-size:15px;max-width:72ch}
.tradelog li{padding:6px 0;border-bottom:1px solid var(--rule2)}
.note-ok::before{content:'\2713  ';color:var(--good);font-weight:800}
.note-no::before{content:'\2717  ';color:var(--bad);font-weight:800}
.coach{border-left:3px solid var(--mark);padding:8px 14px;background:var(--sheet2);border-radius:0 8px 8px 0;max-width:72ch}
.coach li{margin:4px 0}

/* ---- learn ---- */
.learn{display:grid;grid-template-columns:260px 1fr;gap:20px}
@media (max-width:980px){.learn{grid-template-columns:1fr}}
.path{list-style:none;margin:0;padding:0;counter-reset:path}
.path li{counter-increment:path}
.path li.group{counter-increment:none}
.path button{width:100%;display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;text-align:left;border:0;background:none;padding:8px 8px;min-height:44px;border-radius:7px;font-weight:600;font-stretch:90%}
.path button::before{content:counter(path);font-weight:800;font-stretch:70%;font-size:19px;color:var(--ink2);text-align:center}
.path button[aria-current=true]{background:var(--sheet);box-shadow:inset 3px 0 0 var(--ink)}
.path .lv{display:block;font-size:12px;color:var(--ink2);font-weight:500}
.path .group{font-size:13px;font-weight:700;color:var(--ink2);padding:12px 8px 4px;font-stretch:90%}
.trickcard{border:2px solid var(--ink);border-radius:10px;padding:14px 16px;background:var(--paper)}
.trickcard .one{font-size:clamp(18px,2.4vw,22px);font-weight:700;font-stretch:88%;line-height:1.3;margin:4px 0 8px;max-width:60ch}
ul.plain{margin:6px 0;padding-left:20px;max-width:70ch}
ul.plain li{margin:4px 0}

.banner{border:1.5px solid var(--mark);color:var(--ink);background:var(--sheet2);padding:10px 14px;border-radius:8px;margin-bottom:14px}
.errorbox{border:2px solid var(--bad);padding:14px;border-radius:10px;background:var(--sheet)}
.dialog-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:50}
.dialog{background:var(--sheet);color:var(--ink);border-radius:12px;padding:20px;max-width:520px;width:100%;border:1px solid var(--rule)}
textarea.io{width:100%;min-height:130px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);padding:10px;font-size:13px;word-break:break-all}
.spark{display:flex;align-items:flex-end;gap:3px;height:48px}
.spark i{display:block;width:8px;background:var(--ink);border-radius:2px 2px 0 0;opacity:.85}
.flash-ok{animation:okpulse .35s ease-out}
@keyframes okpulse{from{background:color-mix(in srgb,var(--good) 22%,var(--paper))}to{background:var(--paper)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (max-width:420px){
  .app{padding:0 10px 32px}
  .sheet{padding:14px}
  .board{padding:12px 12px 14px 24px}
  .board::before{left:11px}
  .ticket{font-size:26px;flex-basis:160px}
  .options button{min-height:58px}
}

</style>
</head>
<body>
<div class="app">
  <header class="tape">
    <p class="brand"><span aria-hidden="true"></span>Trading Desk Trainer</p>
    <div class="ticks" id="ticks" aria-label="Your numbers"></div>
  </header>
  <div id="errors" role="status"></div>
  <div class="shell">
    <nav class="rail" id="rail" aria-label="Sections"></nav>
    <main id="view"><p class="muted">Loading the trainer. If this stays here, scripts are blocked in this browser.</p></main>
  </div>
</div>
<script>
{
/* Trading Desk Trainer logic. Generated from src/logic by build-logic.js */
(function (root) {
'use strict';

// ---- 01-core.js ----
// ===== Core: random numbers, exact fractions, formatting, answer checking =====

function makeRng(seed) {
  let a = (seed === undefined ? Math.floor(Math.random() * 4294967296) : seed) >>> 0;
  const r = function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  r.int = (lo, hi) => lo + Math.floor(r() * (hi - lo + 1));
  r.pick = arr => arr[Math.floor(r() * arr.length)];
  r.chance = p => r() < p;
  r.shuffle = arr => {
    const b = arr.slice();
    for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = b[i]; b[i] = b[j]; b[j] = t; }
    return b;
  };
  r.normal = () => {
    let u = 0, v = 0;

fam({
  id: 'coinCount', name: 'Counting heads', trick: 'Exactly k heads in n flips is C(n, k) ways out of 2ⁿ. Read C(n, k) off Pascal’s triangle and count the shorter side.',
  space: [
    cross({ n: range(2, 5), k: range(0, 5) }).filter(o => o.k <= o.n).map(o => ({ n: o.n, k: o.k, q: 'eq', p: '1/2' })),
    cross({ n: range(4, 8), k: range(1, 8) }).filter(o => o.k <= o.n).map(o => ({ n: o.n, k: o.k, q: 'ge', p: '1/2' })).concat(cross({ n: range(4, 8), k: range(0, 7) }).filter(o => o.k < o.n).map(o => ({ n: o.n, k: o.k, q: 'le', p: '1/2' }))),
    cross({ n: range(3, 5), k: range(0, 5), p: ['1/3', '2/3', '1/4', '3/4'] }).filter(o => o.k <= o.n).map(o => Object.assign(o, { q: 'eq' }))
  ],
  make(o) {
    const { n, k, q } = o; const p = Frac.parse(o.p); const pq = F(1).sub(p); const steps = [];
    const term = j => F(binom(n, j)).mul(p.pow(j)).mul(pq.pow(n - j));
    let v = F(0), js;
    if (q === 'eq') js = [k]; else if (q === 'ge') js = range(k, n); else js = range(0, k);
    const fair = p.eq(F(1, 2));
    if (fair && js.length > (n + 1) / 2) {
      const other = range(0, n).filter(j => !js.includes(j));
      const wo = other.reduce((acc, j) => acc + binom(n, j), 0n);
      v = F(BI(2) ** BI(n) - wo, BI(2) ** BI(n));
      steps.push(`Count the shorter side. Row ${n} of Pascal’s triangle is ${range(0, n).map(j => fi(binom(n, j))).join(', ')}.`);
      steps.push(`The outcomes you do not want have ${other.map(j => fi(binom(n, j))).join(' + ')} = ${fi(wo)} ways.`);
      steps.push(`So (${fi(2n ** BI(n))} ${MINUS} ${fi(wo)})/${fi(2n ** BI(n))} = ${fp(v)}.`);
    } else if (fair) {
      const w = js.reduce((acc, j) => acc + binom(n, j), 0n); v = F(w, 2n ** BI(n));
      steps.push(`Row ${n} of Pascal’s triangle is ${range(0, n).map(j => fi(binom(n, j))).join(', ')}.`);
      steps.push(`Add the ones you want, ${js.map(j => fi(binom(n, j))).join(' + ')} = ${fi(w)}, out of 2${sup(n)} = ${fi(2n ** BI(n))}. That is ${fp(v)}.`);
    } else {
      v = term(k);
      steps.push(`Each particular order with ${k} heads has chance (${o.p})${sup(k)} ${TIMES} (${fs(pq)})${sup(n - k)}.`);
      steps.push(`There are C(${n}, ${k}) = ${fi(binom(n, k))} orders, so ${fi(binom(n, k))} ${TIMES} ${fs(p.pow(k))} ${TIMES} ${fs(pq.pow(n - k))} = ${fp(v)}.`);
    }
    const what = q === 'eq' ? `exactly ${k} head${k === 1 ? '' : 's'}` : q === 'ge' ? `${k} or more heads` : `${k} or fewer heads`;
    const prompt = fair ? `Flip a fair coin ${n} times. What is the chance of ${what}?` : `A coin lands heads with chance ${o.p}. Flip it ${n} times. What is the chance of ${what}?`;
    return { prompt, v, steps };
  }
});

fam({
  id: 'coinRuns', name: 'Runs of heads', trick: 'Count the sequences with no run instead. Each count is the sum of the previous k counts, like Fibonacci.',
  space: [range(3, 4).map(n => ({ n, k: 2 })), cross({ n: [5, 6], k: [2, 3] }), cross({ n: range(7, 10), k: [3, 4] })],
  make(o) {
    const { n, k } = o; const a = [1n];
    for (let j = 1; j <= n; j++) { if (j < k) a.push(2n ** BI(j)); else { let s = 0n; for (let i = 1; i <= k; i++) s += a[j - i]; a.push(s); } }
    const tot = 2n ** BI(n); const v = F(1).sub(F(a[n], tot));
    const steps = [
      `Count the sequences with no run of ${k} heads. Call that count for length j the j-th count.`,
      `Up to length ${k - 1} every sequence works, and after that each count is the sum of the previous ${k}. Counts for lengths 0 to ${n} are ${a.map(fi).join(', ')}.`,
      `So ${fi(a[n])} of the ${fi(tot)} sequences have no run. The chance of a run is 1 ${MINUS} ${fi(a[n])}/${fi(tot)} = ${fp(v)}.`];
    return { prompt: `Flip a fair coin ${n} times. What is the chance you see ${k} heads in a row somewhere?`, v, steps };
  }
});

function stopValues(s, k, c) { // backward induction values V_0..V_k; c = cost per reroll (Frac)
  c = Frac.of(c || 0); const V = [F(s + 1, 2)];
  for (let j = 1; j <= k; j++) { const cont = V[j - 1].sub(c); let tot = F(0); for (let f = 1; f <= s; f++) tot = tot.add(F(f).gt(cont) ? F(f) : cont); V.push(tot.div(s)); }
  return V;
}
fam({
  id: 'stopping', name: 'Re-roll games', trick: 'Work backwards. Keep a roll only if it beats what you expect from rolling again. With one re-roll on a die, keep 4, 5, 6 and the game is worth 4.25.',

    steps.push(`With no re-rolls left, a roll is worth the average, ${fp(V[0])}.`);
    for (let j = 1; j <= k; j++) {
      const cont = V[j - 1].sub(c); const keep = range(1, s).filter(f => F(f).gt(cont));
      steps.push(`With ${j} re-roll${j > 1 ? 's' : ''} left, rolling again is worth ${fp(V[j - 1])}${c.isZero() ? '' : ' minus the $' + fmtExact(c) + ' cost = ' + fs(cont)}. Keep ${keep.length === 1 ? keep[0] : keep[0] + ' to ' + keep[keep.length - 1]}, re-roll the rest. Value = ${fp(V[j])}.`);

    return { prompt, v, steps };
  }
});
